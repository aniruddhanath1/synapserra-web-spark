    <script>
      // Dark mode bootstrap: no flash, respects system on first visit,
      // persists user choice, and keeps window.setDarkMode for compatibility.
      (function () {
        function apply(dark) {
          const root = document.documentElement;
          root.classList.toggle("dark", !!dark);
          try {
            localStorage.setItem("theme", dark ? "dark" : "light");
          } catch {}
        }

        // 1) First visit: follow system preference. Subsequent visits: follow saved.
        var saved = null;
        try {
          saved = localStorage.getItem("theme");
        } catch {}
        var sysDark = false;
        try {
          sysDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
        } catch {}

        var dark = saved ? saved === "dark" : sysDark;
        if (dark) document.documentElement.classList.add("dark"); // prevent flash

        // 2) Expose a safe toggle
        window.setDarkMode = function (enabled) {
          apply(!!enabled);
        };
      })();
    </script>
